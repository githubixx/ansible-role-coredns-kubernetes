#
# This workflow requires a GALAXY_API_KEY secret present in the GitHub
# repository or organization and accessible to this repository.
#
# See: https://github.com/marketplace/actions/publish-ansible-role-to-galaxy
# See: https://github.com/ansible/galaxy/issues/46

name: Release
on:
  push:
    tags:
      - '*'

defaults:
  run:
    working-directory: 'githubixx.coredns'

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Check out the codebase.
        uses: actions/checkout@v2
        with:
          path: 'githubixx.coredns'

      - name: Set up Python 3.
        uses: actions/setup-python@v2
        with:
          python-version: '3.x'

      - name: Install Ansible.
        run: pip3 install ansible-core

      - name: Trigger a new import on Galaxy.
        env:
          GALAXY_API_KEY: ${{ secrets.GALAXY_API_KEY }}
        run: |
          if [[ -z "$GALAXY_API_KEY" ]]; then
            echo "::error::Set the GALAXY_API_KEY Actions secret to an Ansible Galaxy API token accessible to this repository."
            exit 1
          fi
          ansible-galaxy role import --api-key "$GALAXY_API_KEY" \
            "${GITHUB_REPOSITORY%/*}" "${GITHUB_REPOSITORY#*/}"
