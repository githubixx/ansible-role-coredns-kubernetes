- name: Require intact lifecycle validation
  ansible.builtin.assert:
    that: ansible_skip_tags | difference(coredns__operation_tags + ['molecule-notest', 'notest', 'molecule-idempotence-notest']) | length == 0
    fail_msg: Mandatory validation cannot be skipped.

- name: Inspect Helm version without changing its installation
  ansible.builtin.command:
    argv: ["{{ coredns_helm_binary }}", version, --short]
  changed_when: false
  check_mode: false
  register: coredns__helm_version

- name: Require tested Helm major
  ansible.builtin.assert:
    that: coredns__helm_version.stdout is match('^v3\.')
    fail_msg: This role currently supports Helm 3 only.

- name: Prepare explicit Helm CLI authentication
  ansible.builtin.set_fact:
    coredns__cli: >-
      {{ [coredns_helm_binary]
         + (['--kubeconfig', coredns_kubeconfig] if coredns_kubeconfig | length else [])
         + (['--kube-context', coredns_context] if coredns_context | length else [])
         + ['--namespace', coredns_namespace] }}

- name: Fetch release metadata
  kubernetes.core.helm_info:
    release_name: "{{ coredns_release_name }}"
    release_namespace: "{{ coredns_namespace }}"
    release_state: all
  register: coredns__release

- name: Refuse pending or failed releases during ordinary deployment
  when: "'coredns_rollback' not in ansible_run_tags and 'coredns_absent' not in ansible_run_tags"
  ansible.builtin.assert:
    that: coredns__release.status is not defined or coredns__release.status.status | lower == 'deployed'
    fail_msg: Existing release is not deployed. Inspect history and recover explicitly before reconciling.

- name: Require a role-managed CoreDNS release
  when: coredns__release.status is defined
  ansible.builtin.assert:
    that:
      - coredns__release.status.chart is match('^coredns-')
      - coredns__release.status.manifest | selectattr('kind', 'equalto', 'Deployment') | list | length == 1
      - >-
        (coredns__release.status.manifest | selectattr('kind', 'equalto', 'Deployment')
         | first).metadata.get('annotations', {}).get('githubixx.github.io/coredns-role', '') == 'true'
    fail_msg: Existing release lacks this role's management marker; adoption is unsupported.
