dependency:
  name: galaxy
driver:
  name: vagrant
  provider:
    name: libvirt
    type: libvirt
platforms:
  -
    name: coredns-assets
    box: githubixx/ubuntu-24.04
    memory: 2048
    cpus: 2
    groups: [vpn, k8s_assets, k8s]
    interfaces:
      - auto_config: true
        network_name: private_network
        type: static
        ip: 172.16.31.5
  - box: githubixx/ubuntu-24.04
    memory: 2048
    cpus: 2
    name: coredns-controller1
    groups: [vpn, haproxy, k8s_controller, k8s_worker, k8s]
    interfaces:
      - auto_config: true
        network_name: private_network
        type: static
        ip: 172.16.31.10
  - box: githubixx/ubuntu-24.04
    memory: 2048
    cpus: 2
    name: coredns-controller2
    groups: [vpn, haproxy, k8s_controller, k8s_worker, k8s]
    interfaces:
      - auto_config: true
        network_name: private_network
        type: static
        ip: 172.16.31.20
  - box: githubixx/ubuntu-24.04
    memory: 2048
    cpus: 2
    name: coredns-controller3
    groups: [vpn, haproxy, k8s_controller, k8s_worker, k8s]
    interfaces:
      - auto_config: true
        network_name: private_network
        type: static
        ip: 172.16.31.30
  - box: githubixx/ubuntu-24.04
    memory: 2048
    cpus: 2
    name: coredns-etcd1
    groups: [vpn, k8s_etcd]
    interfaces:
      - auto_config: true
        network_name: private_network
        type: static
        ip: 172.16.31.100
  - box: githubixx/ubuntu-24.04
    memory: 2048
    cpus: 2
    name: coredns-etcd2
    groups: [vpn, k8s_etcd]
    interfaces:
      - auto_config: true
        network_name: private_network
        type: static
        ip: 172.16.31.110
  - box: githubixx/ubuntu-24.04
    memory: 2048
    cpus: 2
    name: coredns-etcd3
    groups: [vpn, k8s_etcd]
    interfaces:
      - auto_config: true
        network_name: private_network
        type: static
        ip: 172.16.31.120
  - box: githubixx/ubuntu-24.04
    memory: 2048
    cpus: 2
    name: coredns-worker1
    groups: [vpn, haproxy, k8s_worker, k8s]
    interfaces:
      - auto_config: true
        network_name: private_network
        type: static
        ip: 172.16.31.200
  - box: githubixx/ubuntu-24.04
    memory: 2048
    cpus: 2
    name: coredns-worker2
    groups: [vpn, k8s_worker, k8s]
    interfaces:
      - auto_config: true
        network_name: private_network
        type: static
        ip: 172.16.31.210
provisioner:
  name: ansible
  connection_options:
    ansible_ssh_user: vagrant
  log: true
scenario:
  test_sequence:
    - dependency
    - create
    - prepare
    - converge
    - idempotence
    - verify
verifier:
  name: ansible
