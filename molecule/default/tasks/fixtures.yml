- name: Create test namespace
  kubernetes.core.k8s:
    api_version: v1
    kind: Namespace
    name: coredns-tests
    state: present

- name: Create fixture certificate directory
  become: true
  ansible.builtin.file:
    path: /tmp/coredns-fixture-tls
    state: directory
    owner: vagrant
    group: vagrant
    mode: "u=rwX,go="
    recurse: true

- name: Create fixture TLS private key
  community.crypto.openssl_privatekey:
    path: /tmp/coredns-fixture-tls/key.pem
    type: ECC
    curve: secp256r1
    mode: "0600"

- name: Create fixture CSR with authenticated upstream identity
  community.crypto.openssl_csr:
    path: /tmp/coredns-fixture-tls/request.pem
    privatekey_path: /tmp/coredns-fixture-tls/key.pem
    common_name: upstream.example.test
    subject_alt_name: [DNS:upstream.example.test]
    basic_constraints: ["CA:TRUE"]
    key_usage: [digitalSignature, keyCertSign]
    mode: "0600"

- name: Create self-signed fixture certificate
  community.crypto.x509_certificate:
    path: /tmp/coredns-fixture-tls/cert.pem
    csr_path: /tmp/coredns-fixture-tls/request.pem
    privatekey_path: /tmp/coredns-fixture-tls/key.pem
    provider: selfsigned
    mode: "0600"

- name: Read fixture certificate material
  ansible.builtin.slurp:
    src: "/tmp/coredns-fixture-tls/{{ item }}"
  loop: [key.pem, cert.pem]
  register: coredns_test_tls
  no_log: true

- name: Install fixture TLS Secret and test trust bundle
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: upstream-tls
        namespace: "{{ item }}"
      type: kubernetes.io/tls
      data:
        tls.key: "{{ coredns_test_tls.results[0].content }}"
        tls.crt: "{{ coredns_test_tls.results[1].content }}"
  loop: [coredns-tests, kube-system]
  no_log: true

- name: Read the VM's upstream resolvers rather than its loopback DNS stub
  ansible.builtin.slurp:
    src: /run/systemd/resolve/resolv.conf
  register: coredns_test_resolver_config

- name: Select upstream resolvers reachable from pod networking
  ansible.builtin.set_fact:
    coredns_test_recursive_resolvers: >-
      {{ coredns_test_resolver_config.content | b64decode
         | regex_findall('(?m)^nameserver\s+(\S+)') }}

- name: Require valid non-loopback upstream resolvers
  ansible.builtin.assert:
    that:
      - coredns_test_recursive_resolvers | length > 0
      - coredns_test_recursive_resolvers | select('ansible.utils.ip_address') | list | length == coredns_test_recursive_resolvers | length
      - coredns_test_recursive_resolvers | select('match', '^(127\.|::1$)') | list | length == 0
    fail_msg: >-
      The assets VM must supply non-loopback upstream DNS servers in
      /run/systemd/resolve/resolv.conf so test pods can resolve public names.

- name: Define test-zone data and public DNS forwarding for plain and TLS clients
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: upstream
        namespace: coredns-tests
      data:
        Corefile: |
          example.test:8053 {
              errors
              file /zones/example.test.db example.test
          }
          .:8053 {
              errors
              forward . {{ coredns_test_recursive_resolvers | join(' ') }}
          }
          tls://example.test:8853 {
              tls /tls/tls.crt /tls/tls.key
              errors
              file /zones/example.test.db example.test
          }
          tls://.:8853 {
              tls /tls/tls.crt /tls/tls.key
              errors
              forward . {{ coredns_test_recursive_resolvers | join(' ') }}
          }
        example.test.db: |
          $ORIGIN example.test.
          @ 60 IN SOA ns.example.test. hostmaster.example.test. (
            1 60 60 3600 60 )
          @ 60 IN NS ns.example.test.
          ns 60 IN A 192.0.2.53
          answer 60 IN A 192.0.2.42
  register: coredns_test_upstream_config

- name: Deploy upstream fixture
  kubernetes.core.k8s:
    state: present
    wait: true
    wait_timeout: 300
    definition:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: upstream
        namespace: coredns-tests
      spec:
        replicas: 1
        selector:
          matchLabels: {app: upstream}
        template:
          metadata:
            labels: {app: upstream}
            annotations:
              checksum/config: "{{ coredns_test_upstream_config.result.data | to_json(sort_keys=true) | hash('sha256') }}"
          spec:
            dnsPolicy: Default
            automountServiceAccountToken: false
            containers:
              - name: dns
                image: coredns/coredns:1.14.7
                args: [-conf, /zones/Corefile]
                ports:
                  - {name: plain, containerPort: 8053, protocol: UDP}
                  - {name: plain-tcp, containerPort: 8053, protocol: TCP}
                  - {name: tls, containerPort: 8853, protocol: TCP}
                volumeMounts:
                  - {name: zones, mountPath: /zones, readOnly: true}
                  - {name: tls, mountPath: /tls, readOnly: true}
                securityContext:
                  allowPrivilegeEscalation: false
                  readOnlyRootFilesystem: true
                  capabilities: {drop: [ALL], add: [NET_BIND_SERVICE]}
            volumes:
              - name: zones
                configMap: {name: upstream}
              - name: tls
                secret:
                  secretName: upstream-tls
                  defaultMode: 292

- name: Expose deterministic upstream
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Service
      metadata: {name: upstream, namespace: coredns-tests}
      spec:
        selector: {app: upstream}
        ports:
          - {name: dns, port: 53, targetPort: 8053, protocol: UDP}
          - {name: dns-tcp, port: 53, targetPort: 8053, protocol: TCP}
          - {name: dot, port: 853, targetPort: 8853, protocol: TCP}

- name: Create cross-worker persistent DNS clients
  kubernetes.core.k8s:
    state: present
    wait: true
    wait_timeout: 300
    wait_condition: {type: Ready, status: "True"}
    definition:
      apiVersion: v1
      kind: Pod
      metadata:
        name: "client-{{ item }}"
        namespace: coredns-tests
        labels: {app: dns-client}
      spec:
        nodeSelector:
          kubernetes.io/hostname: "{{ item }}"
        dnsPolicy: ClusterFirst
        automountServiceAccountToken: false
        containers:
          - name: dns
            image: registry.k8s.io/e2e-test-images/agnhost:2.39
            command: [sleep, "86400"]
          - name: http
            image: busybox:1.37.0
            command: [sleep, "86400"]
  loop: "{{ groups.k8s_worker | difference(groups.k8s_controller) }}"

- name: Create named-port record fixture
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Service
      metadata: {name: record, namespace: coredns-tests}
      spec:
        selector: {app: dns-client}
        ports:
          - {name: dns, port: 8053, protocol: TCP}

- name: Create headless endpoint record fixture
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Service
      metadata: {name: headless, namespace: coredns-tests}
      spec:
        clusterIP: None
        selector: {app: dns-client}
        ports:
          - {name: dns, port: 8053, protocol: TCP}
