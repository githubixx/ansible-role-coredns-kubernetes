- name: Render the real upstream chart without cluster access
  hosts: localhost
  gather_facts: false
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
    coredns_service_ip: "10.32.0.254"
    coredns_template_path: "{{ lookup('ansible.builtin.env', 'COREDNS_TEST_OUTPUT') }}/template.yml"
  roles:
    - role: githubixx.coredns
      tags: inherited
